name: Release

# Publishes the tagged version to npm and creates the GitHub release.
#
# No npm token is stored in this repository. The publish step uses npm trusted
# publishing: GitHub proves to npm which repository and workflow is running,
# and npm issues a short-lived credential for this one job.
#
# The version is STAGED, not published outright: it becomes installable only
# after a maintainer approves it on npmjs.com (package page, "Staged Packages"
# tab) or with `npm stage approve <stage-id>`. Approval requires 2FA.
#
# One-time setup, on npmjs.com > marketing-cli > Settings > Trusted publishing:
#   provider: GitHub Actions     user: MoizIbnYousaf
#   repository: marketing-cli    workflow filename: release.yml
# A new trusted-publisher entry expires unless its first publish succeeds
# within 2 days, so create it shortly before a release.
#
# The job is safe to run again for a tag whose version is already LIVE on npm
# (for example one published from a maintainer's machine with
# `mktg release <bump> --confirm`): the publish is skipped and the GitHub
# release step updates the existing release. A version that is staged but not
# yet approved is not visible to that check, so re-running the job before
# approval tries to stage it a second time; whether npm accepts that has not
# been tried. Approve or reject the staged version first.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # prove this workflow's identity to npm

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage on npm and create the GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Tag must match package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type check
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

      - name: Is this version already on npm?
        id: registry
        run: |
          if [ -n "$(npm view "marketing-cli@$VERSION" version 2>/dev/null)" ]; then
            echo "marketing-cli@$VERSION is already on npm; skipping the publish step."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Staged trusted publishing needs npm 11.15.0 or later and Node 22.14.0
      # or later. The npm bundled with the runner's Node may be older.
      - name: Use an npm that supports staged trusted publishing
        if: steps.registry.outputs.published == 'false'
        run: |
          npm install -g "npm@^11.15.0"
          npm --version

      - name: Stage on npm
        if: steps.registry.outputs.published == 'false'
        run: npm stage publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
